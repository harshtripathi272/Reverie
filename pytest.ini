[pytest]
# Top-level config used when invoking `pytest` from the repo root across
# multiple packages. Each package also has its own `[tool.pytest.ini_options]`
# in its `pyproject.toml` for in-package runs.
asyncio_mode = auto
testpaths =
    packages/schema-py/tests
    packages/adapter-openai/tests
    apps/api/tests
addopts = -ra --strict-markers --import-mode=importlib
