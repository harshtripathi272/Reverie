[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "reverie-adapter-openai"
version = "0.1.0"
description = "Reverie adapter for the OpenAI Agents SDK — captures tracing spans as CognitiveEvents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "Reverie" }]
dependencies = [
    "httpx>=0.27",
    "openai-agents>=0.17,<0.18",
    "reverie-schema",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.30",
    "ruff>=0.7",
]

[project.entry-points."reverie.adapters"]
openai = "reverie_openai:auto"

[tool.uv.sources]
reverie-schema = { path = "../schema-py", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/reverie_openai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501", "N802"]
