[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "reverie-cli"
version = "0.1.0"
description = "Reverie command-line interface"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "Reverie" }]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.7",
    "reverie-schema",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.30",
    "ruff>=0.7",
]

[project.scripts]
reverie = "reverie_cli.main:cli"

[tool.uv.sources]
reverie-schema = { path = "../packages/schema-py", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/reverie_cli"]

[tool.hatch.build.targets.wheel.force-include]
"src/reverie_cli/_bootstrap/sitecustomize.py" = "reverie_cli/_bootstrap/sitecustomize.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]
