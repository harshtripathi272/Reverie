[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "reverie-api"
version = "0.1.0"
description = "Reverie backend — FastAPI event ingestion + SQLite append-only log"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "UNLICENSED" }
authors = [{ name = "Reverie" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "aiosqlite>=0.20",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.5",
    "reverie-schema",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "websockets>=13",
    "ruff>=0.7",
]

[project.scripts]
reverie-api = "reverie_api.__main__:main"

[tool.uv.sources]
reverie-schema = { path = "../../packages/schema-py", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/reverie_api"]

# When the static web app is bundled (via ``python scripts/bundle_web_app.py``),
# include it in the wheel. The directory itself is gitignored so it's only
# present after a build pipeline runs.
#
# We use the ``artifacts`` mechanism instead of ``force-include`` so the build
# doesn't fail when the directory hasn't been bundled yet (e.g. during CI
# test runs that build wheels from a fresh checkout).
artifacts = [
    "src/reverie_api/_web_static/**",
]

[tool.hatch.build.targets.sdist]
include = [
    "src/reverie_api/**",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]
